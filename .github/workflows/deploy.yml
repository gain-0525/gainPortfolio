name: Deploy Portfolio to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Check environment
        run: |
          node --version
          npm --version
          pwd
          git log -1 --oneline
          npm pkg get optionalDependencies dependencies devDependencies

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Copy build files to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "dist/*"
          target: "/home/ubuntu/portfolio-dist"
          strip_components: 1

      - name: Deploy files to Nginx
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo mkdir -p /var/www/html
            sudo cp -r /home/ubuntu/portfolio-dist/. /var/www/html/
            sudo nginx -t
            sudo systemctl reload nginx
